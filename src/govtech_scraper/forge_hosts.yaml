# Government-run code servers outside GitHub, read through their public APIs.
#
# Each entry is one server hostname. `platform` is gitlab (the default) or forgejo
# (Forgejo and Gitea, which share an API). `country` uses the same
# labels as the government.github.com registry so the two sources line up.
# `owners` (optional) limits the fetch to those top-level groups, for shared
# hosts such as gitlab.com. `include_personal: true` keeps projects owned by
# individual users. `level` is informational for now.
#
# Whole servers are added here by a maintainer. Single accounts on shared servers
# (gitlab.com, codeberg.org) come in as community submissions instead; see
# submissions/TEMPLATE.yaml.
#
# See docs/forges.md.

hosts:
  - host: gitlab.opencode.de
    country: Germany
    level: national
    description: OpenCoDE, the German public administration's code platform (ZenDiS)

  - host: code.europa.eu
    country: European Union
    level: international
    description: European Commission code platform for EU institutions (EC OSPO)

  - host: code.overheid.nl
    platform: forgejo
    country: Netherlands
    level: national
    description: code.overheid.nl, the Dutch government's code platform (pilot since April 2026)

  - host: gitlab.adullact.net
    country: France
    level: mixed
    description: ADULLACT, association of French public bodies sharing software

  - host: repo1.dso.mil
    country: U.S. Military and Intelligence
    level: national
    description: US Department of Defense Platform One

  - host: code.usgs.gov
    country: U.S. Federal
    level: national
    description: US Geological Survey

  - host: code.ornl.gov
    country: U.S. Federal
    level: research
    description: Oak Ridge National Laboratory (US Department of Energy)
