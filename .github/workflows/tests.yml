name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.7"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --frozen --dev

      - name: Run tests
        run: uv run --frozen pytest tests/ -v --tb=short

      - name: Build package
        run: uv build --no-sources
