name: Scrape & Publish Government Repos

on:
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      force_update:
        description: 'Force update (ignore cache)'
        required: false
        type: boolean
        default: false
      run_tagging:
        description: 'Retired: true fails explicitly; metadata refresh never runs paid tagging'
        required: false
        type: boolean
        default: false

concurrency:
  group: govtech-publication
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Reject retired tagging request
        if: github.event.inputs.run_tagging == 'true'
        run: |
          echo 'run_tagging=true is retired. See docs/operations.md for classification migration.'
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.7"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --frozen --dev --extra api

      - name: Test before any publication or deployment
        run: uv run --frozen pytest tests/ -q

      - name: Download previous database
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --frozen python scripts/download_db.py

      - name: Migrate restored history offline
        run: uv run --frozen python scripts/migrate_reliability.py

      - name: Scrape repositories
        env:
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          uv run --frozen govtech-scraper -v scrape $FORCE_FLAG

      - name: Show stats
        run: uv run --frozen govtech-scraper stats

      - name: Prepare and verify one WAL-safe publication snapshot
        run: uv run --frozen python scripts/prepare_publication.py

      - name: Retain validated snapshot and exports
        uses: actions/upload-artifact@v4
        with:
          name: govtech-publication-${{ github.run_number }}
          path: publication/
          if-no-files-found: error
          retention-days: 90

      - name: Publish to HuggingFace
        id: publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --frozen python scripts/publish_hf.py

      - name: Update and verify separately hosted Index
        env:
          GOVTECH_RAILWAY_ROLLOUT_ENABLED: ${{ vars.GOVTECH_RAILWAY_ROLLOUT_ENABLED }}
          GOVTECH_RAILWAY_PROJECT_ID: ${{ vars.GOVTECH_RAILWAY_PROJECT_ID }}
          GOVTECH_RAILWAY_ENVIRONMENT_ID: ${{ vars.GOVTECH_RAILWAY_ENVIRONMENT_ID }}
          GOVTECH_RAILWAY_WEB_SERVICE_ID: ${{ vars.GOVTECH_RAILWAY_WEB_SERVICE_ID }}
          GOVTECH_RAILWAY_WEB_URL: ${{ vars.GOVTECH_RAILWAY_WEB_URL }}
          GOVTECH_RAILWAY_API_TOKEN: ${{ secrets.GOVTECH_RAILWAY_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --frozen python scripts/update_index.py

      - name: Retain publication receipt and Index result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govtech-receipts-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            baseline.json
            publication/receipt.json
            publication/index-verification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Deploy dashboard to HF Spaces
        if: always() && steps.publish.outcome == 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --frozen python - <<'EOF'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, CommitOperationAdd

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          space_id = "AndreasThinks/govtech-dashboard"

          web_dir = Path("web")
          deploy_files = ["app.py", "queries.py", "Dockerfile", "requirements.txt"]

          operations = []
          for filename in deploy_files:
              src = web_dir / filename
              if not src.is_file():
                  raise RuntimeError(f"Missing dashboard artifact: {filename}")
              if src.exists():
                  operations.append(
                      CommitOperationAdd(
                          path_in_repo=filename,
                          path_or_fileobj=str(src),
                      )
                  )
                  print(f"  Queued: {filename}")

          if operations:
              result = api.create_commit(
                  repo_id=space_id,
                  repo_type="space",
                  operations=operations,
                  commit_message="chore: redeploy dashboard after scrape",
              )
              print(f"Dashboard deployed: {result.commit_url}")
          else:
              print("No dashboard files found, skipping Space deploy.")
          EOF
