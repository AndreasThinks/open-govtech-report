name: Validate Repository Submission

on:
  pull_request:
    paths:
      - 'submissions/pending/**.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The changed-file step compares against the PR base's merge history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.7"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install PyYAML
        run: uv sync --frozen

      - name: Find changed submission files
        id: changed
        run: |
          # Get only the YAML files in submissions/pending/ that changed in this PR
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'submissions/pending/*.yaml' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed submission files: $FILES"

      - name: Validate submissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No submission files changed."
            exit 0
          fi
          # --online confirms each account exists through its platform's API.
          uv run --frozen python scripts/validate_submission.py --online $FILES

      - name: Post result comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Submission validation failed ❌

            One or more submission files have errors. Check the **Actions** tab for details.

            Common issues:
            - Missing required fields (\`org\` for GitHub, or \`host\`, \`platform\` and \`owner\` for other forges, plus \`country\`, \`account_type\`, \`description\`, \`evidence\`)
            - \`country\` must be a 2-letter ISO code (e.g. \`GB\`, \`NL\`) or a country name
            - \`platform\` must be \`gitlab\` or \`forgejo\` (Forgejo, Gitea and Codeberg)
            - The account was not found through its platform's API
            - \`evidence\` must contain at least one real https:// link
            - Filename must be lower case letters, digits and hyphens (e.g. \`nl-commonground.yaml\`)

            See [submissions/TEMPLATE.yaml](../blob/main/submissions/TEMPLATE.yaml) for the correct format.`
            })
