name: Validate Repository Submission

on:
  pull_request:
    paths:
      - 'submissions/pending/**.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Find changed submission files
        id: changed
        run: |
          # Get only the YAML files in submissions/pending/ that changed in this PR
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'submissions/pending/*.yaml' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed submission files: $FILES"

      - name: Validate submissions
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No submission files changed."
            exit 0
          fi
          python scripts/validate_submission.py $FILES

      - name: Post result comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Submission validation failed ❌

            One or more submission files have errors. Check the **Actions** tab for details.

            Common issues:
            - Missing required fields (\`org\`, \`country\`, \`account_type\`, \`description\`, \`evidence\`)
            - \`country\` must be a 2-letter ISO code (e.g. \`GB\`, \`US\`, \`DE\`)
            - \`account_type\` must be \`org\` or \`user\`
            - \`evidence\` must contain at least one real URL
            - Filename must start with the country code (e.g. \`gb-org-name.yaml\`)

            See [submissions/TEMPLATE.yaml](../blob/main/submissions/TEMPLATE.yaml) for the correct format.`
            })
