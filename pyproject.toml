[project]
name = "open-govtech-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10.5",
    "aiolimiter>=1.1.0",
    "anthropic>=0.34.2",
    "asyncio>=3.4.3",
    "beautifulsoup4>=4.12.3",
    "cachetools>=5.5.0",
    "cryptography>=44.0.0",
    "gitpython>=3.1.43",
    "nbconvert>=7.16.5",
    "nbformat>=5.10.4",
    "nltk>=3.9.1",
    "openai>=1.46.1",
    "pandas>=2.2.2",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=17.0.0",
    "pyjwt>=2.10.1",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.0.1",
    "python-fasthtml>=0.12.0",
    "pyyaml>=6.0.2",
    "repo-to-text>=0.1.4",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "selenium>=4.27.1",
    "sqlalchemy>=2.0.37",
    "tiktoken>=0.8.0",
    "tqdm>=4.66.5",
    "webdriver-manager>=4.0.2",
    "wget>=3.2",
    "youtube-transcript-api>=0.6.3",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["E501"]
