[project]
name = "govtech-scraper"
version = "0.1.0"
description = "Scrapes and catalogs public GitHub repositories from government organizations worldwide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "aiolimiter>=1.1",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.10",
    "click>=8.1",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "scipy>=1.17.1",
    "rapidfuzz>=3.14.3",
    "pyarrow==25.0.1",
    "huggingface-hub==1.8.0",
]

[project.scripts]
govtech-scraper = "govtech_scraper.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "mcp>=2.3",
    "uvicorn>=0.30",
]
decision = [
    "gradio-client>=2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govtech_scraper = ["decision/taxonomy.yaml", "api/*.yaml", "forge_hosts.yaml", "site/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501", "I", "UP"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "streamlit==1.65.0",
]
