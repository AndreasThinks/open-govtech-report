[project]
name = "govtech-scraper"
version = "0.1.0"
description = "Scrapes and catalogs public GitHub repositories from government organizations worldwide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "aiolimiter>=1.1",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.10",
    "click>=8.1",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "scipy>=1.17.1",
]

[project.scripts]
govtech-scraper = "govtech_scraper.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
